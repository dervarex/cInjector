<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <div class="site">
      <span class="label">Editing</span>
      <span id="domain">...</span>
    </div>
    <span id="status"></span>
    <button id="save" title="Ctrl+S">Save</button>
  </header>
  <textarea id="css" spellcheck="false" placeholder="body { background: red; }"></textarea>
  <script type="module" src="editor.js"></script>
</body>
</html>
