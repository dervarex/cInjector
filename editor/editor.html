<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CSS Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="site">
      <span class="label">Editing</span>
      <span id="domain">...</span>
    </div>
    <span id="status"></span>
    <button id="save" title="Ctrl+S">Save</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="css">CSS</button>
    <button class="tab" data-tab="source">Source</button>
    <button id="pop-out-source" class="icon-button" title="Open source in new window"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
    <button id="pick-element" class="icon-button" title="Pick an element and add a rule for it"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  </nav>
  <main id="panes">
    <div id="editor"></div>
    <iframe id="source-frame" class="inactive"></iframe>
  </main>
  <script type="module" src="dist/script.js"></script>
</body>
</html>
